<!DOCTYPE html>

<html>

<head>
    <title>HCIBS SJ Passdown - Sign Up</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: coral;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .signup-box {
        background: white;
        width: 350px;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        text-align: center;
    }

    h1 {
        color: coral;
        margin-bottom: 10px;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 97%;
        padding: 12px;
        margin-top: 15px;
        background: coral;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #ff6347;
    }

    .login {
        margin-top: 20px;
        font-size: 14px;
    }

    .login a {
        color: coral;
        text-decoration: none;
        font-weight: bold;
    }
</style>

</head>

<body>

<div class="signup-box">

<h1>Create an Account</h1>

<input type="text" placeholder="Username">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<input type="password" placeholder="Confirm Password">

<a href="guidelines.html">
    <button type="button">Sign Up</button>
</a>

<div class="login">
    Already have an account?
    <a href="index.html">Log In</a>
</div>

</div>

</body>

</html>
