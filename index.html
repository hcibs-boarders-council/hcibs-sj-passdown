<!DOCTYPE html>

<html>

<head>
    <title>HCIBS SJ Passdown - Login</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: coral;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .login-box {
        background: white;
        width: 350px;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        text-align: center;
    }

    h1 {
        color: coral;
        margin-bottom: 10px;
    }

    p {
        color: #666;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 97%;
        padding: 12px;
        margin-top: 15px;
        background: coral;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #ff6347;
    }

    .signup {
        margin-top: 20px;
        font-size: 14px;
    }

    .signup a {
        color: coral;
        text-decoration: none;
        font-weight: bold;
    }
</style>

</head>

<body>

<div class="login-box">

<h1>Welcome!</h1>

<p>Log in to start "shopping"!</p>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<a href="main.html">
    <button type="button">Log In</button>
</a>

<div class="signup">
    Don't have an account?
    <a href="signup.html">Sign Up</a>
</div>

</div>

</body>

</html>
